<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <title>Test no oficial IHF · Catálogo de preguntas de Reglas de Juego</title>
  <meta name="description" content="Plataforma de estudio local con los catálogos de preguntas de las Reglas de Juego de la IHF: filtros por tema, tests de 5/10/20/30 preguntas, pistas con directrices e informe PDF.">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="styles/styles.css">
  <script type="module" src="./scripts/app.js"></script>
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
  <div id="app" class="flex min-h-screen flex-col">
    <header class="sticky top-0 z-40 border-b border-slate-200/70 bg-white/85 backdrop-blur-md dark:border-slate-800 dark:bg-slate-900/85">
      <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6">
        <div class="flex items-center gap-3">
          <a class="rounded-xl bg-gradient-to-br from-brand-950 via-brand-900 to-brand-700 min-h-10 min-w-10 shadow-lift" href="/">
            <img src="assets/logo-handball-white.png" alt="" width="40" height="40" class="h-10 w-10">
          </a>
          <div class="leading-tight">
            <p class="font-display text-base font-semibold tracking-tight text-ink dark:text-slate-100">Reglas de juego IHF</p>
            <p class="text-xs text-slate-500 dark:text-slate-400">Tests basados en el catálogo oficial · <strong>Ed. julio 2025</strong></p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="hidden items-center gap-2 sm:flex" id="header-stats"></div>
          <button type="button" id="theme-toggle" class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-slate-600 shadow-sm transition hover:border-brand-300 hover:bg-slate-50 hover:text-brand-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:border-slate-600 dark:hover:bg-slate-700 dark:hover:text-white" aria-label="Cambiar tema">
            <svg class="h-5 w-5 dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            <svg class="hidden h-5 w-5 dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 sm:px-6">
      <section id="screen-setup" class="screen" aria-label="Configuración del test"></section>
      <section id="screen-quiz" class="screen hidden" aria-label="Test en curso"></section>
      <section id="screen-results" class="screen hidden" aria-label="Resultados"></section>
    </main>

    <footer class="border-t border-slate-200/70 bg-white/70 dark:border-slate-800 dark:bg-slate-900/70">
      <div class="mx-auto max-w-6xl px-4 py-6 sm:px-6">
        <div class="flex flex-col gap-2 text-xs text-slate-500 dark:text-slate-400 sm:flex-row sm:items-center sm:justify-between">
          <p>Fuentes: <a class="link" href="documents/CATALOGO%20RULE%20Test%202025_Ed.%20Ene-2026_def.pdf" target="_blank" rel="noopener">Catálogo de preguntas IHF (ES)</a> · <a class="link" href="documents/IHF%20Catalogue%20of%20Rules%20Questions_Answers_010725_EN_final_4.pdf" target="_blank" rel="noopener">Resolución de preguntas (EN)</a> · <a class="link" href="documents/Reglas%20de%20Juego%20(Septiembre%202025)%20Web.pdf" target="_blank" rel="noopener">Reglas de juego (1 jul 2025)</a></p>
        </div>
        <p class="mt-3 text-xs text-slate-500 dark:text-slate-400">Web creada y diseñada por <a class="link" href="https://smartinezdev.com" target="_blank" rel="noopener">Santi Martínez</a> - árbitro territorial de la FBHB (España).</p>
      </div>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
