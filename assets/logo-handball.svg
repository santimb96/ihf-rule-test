<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Catálogo IHF - Test reglas de juego">
  <defs>
    <linearGradient id="ihf-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b5eff"/>
      <stop offset="1" stop-color="#1e33b8"/>
    </linearGradient>
    <!-- Gradiente para el balonmano -->
    <linearGradient id="handball-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <!-- Patrón de textura sutil -->
    <pattern id="grid-pattern" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M5 0 L5 5 M0 5 5 5" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>
  <!-- Fondo principal con gradiente mejorado -->
  <rect width="40" height="40" rx="12" fill="url(#ihf-tile)"/>
  <!-- Patrón de textura de fondo -->
  <rect width="40" height="40" fill="url(#grid-pattern)" opacity="0.3"/>
  <!-- Grupo principal -->
  <g fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9">
    <!-- Círculo central -->
    <circle cx="20" cy="20" r="11"/>
    <!-- Tres caminos estilizados con mejor definición -->
    <path d="M20 2c2 3.5 2.2 7.3 0 10.5" stroke-linecap="round"/>
    <path d="M20 38c2-3.5 2.2-7.3 0-10.5" stroke-linecap="round" transform="rotate(120 20 20)"/>
    <path d="M20 2c2 3.5 2.2 7.3 0 10.5" stroke-linecap="round" transform="rotate(240 20 20)"/>
  </g>
  <!-- Patrón hexagonal sutil que sugiere la textura del balonmano -->
  <g transform="translate(20,20)" opacity="0.6">
    <path d="M0 -8 L3.5 -4.5 L3.5 4.5 L0 8 Z" fill="url(#handball-skin)" stroke="#ffffff" stroke-width="0.3"/>
    <path d="M0 -8 L-3.5 -4.5 L-3.5 4.5 Z" fill="url(#handball-skin)" stroke="#ffffff" stroke-width="0.3"/>
    <path d="L-5.5 0 L-3.5 3.5 L0 8 L3.5 3.5 L5.5 0 L3.5 -3.5 L0 -8 L-3.5 -3.5 L-5.5 0 Z" fill="url(#handball-skin)" stroke="#ffffff" stroke-width="0.3"/>
  </g>
  <!-- Etiqueta de marca mejorada -->
  <text x="20" y="34" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="5" font-weight="600" fill="#1e33b8" letter-spacing="1">IHF</text>
</svg>